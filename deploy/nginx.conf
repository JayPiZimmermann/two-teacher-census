# Static site, tuned for a fly.io shared-cpu-1x machine that stops when idle.
# Everything is precomputed; nginx only hands out files, precompressed where
# it matters (explorer.js and census-map.js are generated at image build).
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  gzip on;
  gzip_static on;                 # serve the *.gz written at build time
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vendored KaTeX never changes without a rename of the directory.
    location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Generated data and code: revalidate hourly, so a redeploy shows up soon.
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=3600"; }
    location = /index.html { add_header Cache-Control "public, max-age=600"; }
    location / { try_files $uri $uri/ =404; }
  }
}
